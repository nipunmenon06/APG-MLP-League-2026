<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APG MLP Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --panel:#FFFFFF; --ink:#12232E; --muted:#586A75; --line:#CBD5CC;
  --court:#12456B; --court-deep:#0D3654; --kitchen:#2C7A66; --ball:#E1D23C; --onball:#1A2400;
  --alert:#B23A26; --ok:#1F7A4D; --chip:#E4EAE2; --focus:#1B6FB5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1F2F; --panel:#122E45; --ink:#EAF1EC; --muted:#93A9B5; --line:#28485F;
    --court:#1A5A87; --court-deep:#134466; --kitchen:#3E9C84; --ball:#E6D64E; --onball:#1A2400;
    --alert:#FF8266; --ok:#5CD29B; --chip:#1A3A54; --focus:#7CC0F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1F2F; --panel:#122E45; --ink:#EAF1EC; --muted:#93A9B5; --line:#28485F;
  --court:#1A5A87; --court-deep:#134466; --kitchen:#3E9C84; --ball:#E6D64E; --onball:#1A2400;
  --alert:#FF8266; --ok:#5CD29B; --chip:#1A3A54; --focus:#7CC0F0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:1500px;margin:0 auto;padding:14px}
#app.screen{max-width:none;padding:1.2vw;font-size:clamp(13px,1.05vw,22px)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.9rem;letter-spacing:.01em;line-height:1.05}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--onball)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:.85rem}

/* generic panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-family:var(--display);font-size:1.5rem;font-weight:700}
.panel .hint{margin:0 0 12px;color:var(--muted);font-size:.92rem;max-width:70ch}
.note{border-left:4px solid var(--ball);background:var(--chip);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:14px;max-width:80ch}
.note.warn{border-left-color:var(--alert)}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:8px 0}
.row label{display:flex;gap:6px;align-items:center}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input[type=number]{width:5.6em}
textarea{width:100%;min-height:110px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;color:var(--muted);font-weight:600}
td input[type=text]{width:100%;min-width:9em}
td input[type=number]{width:4.8em}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--court);color:#fff;font-size:.78rem;font-weight:600}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.order li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.order .n{font-family:var(--display);font-weight:700;font-size:1.5rem;width:1.6em;color:var(--court)}
.order .who{flex:1;min-width:0}
.order .who input{width:100%}
.order .cap{color:var(--muted);font-size:.85rem}

/* clock panel: the court */
.clock{position:relative;background:var(--court);color:#fff;border-radius:14px;padding:1.1em 1.4em;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:.6em 1.4em;align-items:center;overflow:hidden}
.clock::before{content:"";position:absolute;inset:.45em;border:2px solid rgba(255,255,255,.5);border-radius:10px;pointer-events:none}
.clock::after{content:"";position:absolute;top:.45em;bottom:.45em;left:66%;width:2px;background:rgba(255,255,255,.28);pointer-events:none}
.ock-label{font-family:var(--display);font-weight:600;font-size:1.15em;display:flex;gap:.5em;align-items:center}
.dot{width:.75em;height:.75em;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 .25em rgba(61,220,132,.28)}
.dot.off{background:#9DB4C3;box-shadow:none}
.dot.pause{background:var(--ball);box-shadow:0 0 0 .25em rgba(225,210,60,.28)}
.ock-team{font-family:var(--display);font-weight:700;font-size:3.1em;line-height:1;margin:.1em 0}
.ock-sub{opacity:.9}
.time{font-family:var(--display);font-weight:700;font-size:5.4em;line-height:1;color:var(--ball);font-variant-numeric:tabular-nums;text-align:right;min-width:2.6em}
.time.low{color:#FF9A80}
.time.done{color:#FF9A80;font-size:4em}
.next{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.5em;align-items:center;position:relative;z-index:1}
.next .lbl{font-weight:600;opacity:.85;margin-right:.2em}
.chipn{background:rgba(255,255,255,.14);border-radius:99px;padding:.15em .8em;white-space:nowrap}
.chipn b{font-family:var(--display);font-size:1.05em;margin-right:.35em;color:var(--ball)}
.banner{position:absolute;inset:0;z-index:5;background:var(--ball);color:var(--onball);display:flex;flex-direction:column;justify-content:center;padding:1em 1.6em;animation:slide .35s ease-out}
.banner .b1{font-family:var(--display);font-weight:600;font-size:1.3em}
.banner .b2{font-family:var(--display);font-weight:700;font-size:3em;line-height:1}
@keyframes slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}

/* control bar */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.controls .sp{flex:1}

/* board */
.grid{display:grid;grid-template-columns:minmax(270px,1fr) 2.2fr;gap:12px;align-items:start}
.avail,.teams-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9em}
.avail h3,.teams-wrap h3{margin:0 0 .5em;font-family:var(--display);font-size:1.35em;font-weight:700}
.filters{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin-bottom:.6em}
.filters input[type=text]{flex:1;min-width:8em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.45em;max-height:70vh;overflow:auto;padding:2px}
.screen .list{max-height:none}
.tile{display:block;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:.45em .6em;position:relative}
button.tile:hover{border-color:var(--court);background:var(--panel)}
.tile .nm{font-weight:600;line-height:1.15;padding-right:2.6em}
.tile .rt{position:absolute;top:.35em;right:.5em;font-family:var(--display);font-weight:700;font-size:1.2em;color:var(--court)}
:root[data-theme="dark"] .tile .rt{color:var(--ball)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile .rt{color:var(--ball)}}
.tile .mt{color:var(--muted);font-size:.8em}
.tile.blocked{opacity:.5;border-style:dashed}
.tile .why{color:var(--alert);font-size:.74em;line-height:1.2;margin-top:.1em}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.7em}
@media (min-width:1150px){.teams{grid-template-columns:repeat(4,1fr)}}
.team{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.team.on{outline:3px solid var(--ball);outline-offset:0;border-color:var(--ball)}
.team header{background:var(--court-deep);color:#fff;padding:.5em .7em;display:flex;justify-content:space-between;gap:.5em;align-items:center}
.team header .tn{font-family:var(--display);font-weight:700;font-size:1.25em;line-height:1.05}
.team header .co{font-size:.78em;opacity:.85}
.team header .pos{font-family:var(--display);font-weight:700;font-size:1.4em;color:var(--ball)}
.team ul{list-style:none;margin:0;padding:.3em .5em}
.team li{display:flex;justify-content:space-between;gap:.5em;padding:.22em 0;border-bottom:1px dashed var(--line)}
.team li:last-child{border-bottom:0}
.team li.open{color:var(--muted)}
.team li .r{font-family:var(--display);font-weight:700;color:var(--court)}
:root[data-theme="dark"] .team li .r{color:var(--ball)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .team li .r{color:var(--ball)}}
.team li .c{font-size:.7em;background:var(--kitchen);color:#fff;border-radius:4px;padding:0 .4em;margin-left:.3em;vertical-align:middle}
.team footer{padding:.4em .7em .6em;border-top:1px solid var(--line)}
.meter{height:.55em;background:var(--chip);border-radius:99px;overflow:hidden;margin:.25em 0}
.meter i{display:block;height:100%;background:var(--kitchen)}
.meter.over i{background:var(--alert)}
.team .ft{display:flex;justify-content:space-between;font-size:.85em;color:var(--muted)}
.team .ft b{color:var(--ink)}

/* picks */
.pickrow{display:flex;gap:.8em;padding:6px 0;border-bottom:1px solid var(--line)}
.pickrow .pn{font-family:var(--display);font-weight:700;width:2.4em;color:var(--court)}
pre.out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:.85rem}

/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(6,20,30,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;padding:20px;max-width:460px;width:100%}
.modal h3{margin:0 0 6px;font-family:var(--display);font-size:1.6rem}
.modal ul{margin:8px 0;padding-left:1.2em;color:var(--alert)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;max-width:90vw}
.exit{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;opacity:.55}
.exit:hover{opacity:1}
.empty{color:var(--muted);padding:.6em 0}
.small{font-size:.85rem;color:var(--muted)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}
  .clock::after{display:none}
  .time{text-align:left;font-size:4.2em}
  .ock-team{font-size:2.3em}
  .list{max-height:50vh}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- seed data (from the league announcement) ---------- */
var SEED=[["Jason Altomare",3.6],["Alex Andreatta",4.2],["Jamie Carey",4],["Avavind Chel",4],["Nate Collins",4.1],["Ramin Erfanian",4.4],["Sharat G.",4.45],["Chris Gaber",3.95],["Prashant Gupta",3.77],["Elijah Hagen",4.5],["Colton Hoge",3.5],["John Keiffer",4.6],["Raman Marya",4.5],["Bill McCarthy",4.7],["Brian McElroy",4.5],["Nipun Menon",4.12],["Tom Ngo",4.46],["Shane Oren",4.31],["Eli Orozco",4.5],["Arnold Paulos",4],["Paddy Ramanathan",4],["David Rebman",3.9],["Sachin Sheth",4],["Shikher Singla",3.75],["Noah Thomas",4.2],["Tony Thomas",4.6],["Tanya Veldkamp",4.1],["Nate Veldkamp",4.4],["Alan Vernon",4.5],["Jeremy Weisshar",4.46]];
var SUBS=[["Ricardo Amayo",3.6],["Robert Gates",3.5],["Puneet Khurana",4.24],["Mark Lowe",4.3],["Steve Lui",4.96],["Keri McArthur",3.9],["Jason Morris",3.4],["Mike Nelson",4.35],["Mike Prochaska",3.93],["Rabi",4.5],["Charlene",4],["Ali",4.2],["Tony",3.95]];
var CAPS=["Alex Andreatta","Ramin Erfanian","Raman Marya","Brian McElroy","Tom Ngo","Eli Orozco","Tony Thomas","Tanya Veldkamp"];
var STYLES=["Dinker","Aggressive","All-around"];

/* ---------- state ---------- */
var KEY='apg-mlp-draft-v1';
var storageOK=true, memoryOnly=null;
var state=null, mode='setup', screen=false, modal=null, toastMsg='', toastT=null;
var search='', eligibleOnly=false;
var lastCount=null, banner=null, bannerT=null;

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lastName(n){var p=String(n).trim().split(/\s+/);return p[p.length-1]}
function f2(n){return Number(n).toFixed(2)}
function mkPlayer(name,dupr,sub){return {id:uid(),name:name,dupr:dupr,age:null,gender:'',style:'',sub:!!sub}}

function freshState(){
  var players=[];
  SEED.forEach(function(r){players.push(mkPlayer(r[0],r[1],false))});
  SUBS.forEach(function(r){players.push(mkPlayer(r[0],r[1],true))});
  var teams=CAPS.map(function(n){
    var p=players.filter(function(x){return x.name===n})[0];
    return {id:uid(),name:'Team '+lastName(n),captainId:p.id};
  });
  return {v:1,rev:0,
    settings:{leagueName:'APG MLP Player Draft',rosterSize:5,timerSec:90,capOn:true,cap:16.9,capCount:4,
      rules:{rating:{on:false,thr:4.4,max:1},age:{on:false,thr:50,max:1},gender:{on:false,minM:2,minF:2},style:{on:false,max:2}}},
    players:players,teams:teams,picks:[],status:'setup',clockEnd:null,remaining:null};
}

function load(){
  try{
    localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');
    var s=localStorage.getItem(KEY);
    if(s){var o=JSON.parse(s);if(o&&o.v===1&&o.players&&o.teams)return o}
  }catch(e){storageOK=false}
  return null;
}
function save(){
  state.rev=(state.rev||0)+1;
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}
}
function commit(){save();render()}

/* ---------- derived data ---------- */
function P(id){for(var i=0;i<state.players.length;i++)if(state.players[i].id===id)return state.players[i];return null}
function T(){return state.teams.length}
function totalPicks(){return T()*(state.settings.rosterSize-1)}
function pickTeam(n){var t=T();if(!t)return 0;var r=Math.floor(n/t),p=n%t;return r%2===0?p:t-1-p}
function roundOf(n){return Math.floor(n/T())+1}
function captainIds(){var o={};state.teams.forEach(function(t){o[t.captainId]=1});return o}
function pickedIds(){var o={};state.picks.forEach(function(k){o[k.pid]=1});return o}
function availablePlayers(){
  var c=captainIds(),k=pickedIds();
  return state.players.filter(function(p){return !p.sub&&!c[p.id]&&!k[p.id]});
}
function teamRoster(ti){
  var t=state.teams[ti];var r=[];var cp=P(t.captainId);if(cp)r.push(cp);
  state.picks.forEach(function(k){if(k.team===ti){var p=P(k.pid);if(p)r.push(p)}});
  return r;
}
function currentPickN(){return state.picks.length}
function currentTeamIdx(){
  if(state.status!=='live'&&state.status!=='paused')return null;
  return pickTeam(currentPickN());
}
function capTotalOf(nums){
  var s=state.settings,a=nums.slice().sort(function(x,y){return y-x});
  var n=s.capCount>0?s.capCount:a.length;
  return a.slice(0,n).reduce(function(x,y){return x+y},0);
}
function teamCap(ti){return capTotalOf(teamRoster(ti).map(function(p){return p.dupr}))}
function teamAvg(ti){var r=teamRoster(ti);if(!r.length)return 0;return r.reduce(function(a,p){return a+p.dupr},0)/r.length}

/* ---------- league rules ---------- */
function checkPick(ti,p){
  var s=state.settings,R=s.rules,issues=[];
  var after=teamRoster(ti).concat([p]);
  if(s.capOn){
    var tot=capTotalOf(after.map(function(x){return x.dupr}));
    if(tot>s.cap+1e-9){
      issues.push('Team DUPR would be '+f2(tot)+' (limit '+f2(s.cap)+')');
    }else{
      var left=s.rosterSize-after.length;
      if(left>0){
        var cheap=availablePlayers().filter(function(x){return x.id!==p.id}).map(function(x){return x.dupr}).sort(function(a,b){return a-b}).slice(0,left);
        if(cheap.length>=left){
          var fill=capTotalOf(after.map(function(x){return x.dupr}).concat(cheap));
          if(fill>s.cap+1e-9)issues.push('Leaves no way to fill the roster under '+f2(s.cap));
        }
      }
    }
  }
  if(R.rating.on){
    var hi=after.filter(function(x){return x.dupr>R.rating.thr}).length;
    if(hi>R.rating.max)issues.push('Would have '+hi+' players rated over '+R.rating.thr+' (max '+R.rating.max+')');
  }
  if(R.age.on){
    var old=after.filter(function(x){return x.age!=null&&x.age>R.age.thr}).length;
    if(old>R.age.max)issues.push('Would have '+old+' players over age '+R.age.thr+' (max '+R.age.max+')');
  }
  if(R.gender.on){
    if(!p.gender)issues.push('Gender not set for this player');
    var m=after.filter(function(x){return x.gender==='M'}).length,w=after.filter(function(x){return x.gender==='F'}).length;
    if(m>s.rosterSize-R.gender.minF)issues.push('Too many men: '+R.gender.minF+' women still needed');
    if(w>s.rosterSize-R.gender.minM)issues.push('Too many women: '+R.gender.minM+' men still needed');
  }
  if(R.style.on&&p.style){
    var same=after.filter(function(x){return x.style===p.style}).length;
    if(same>R.style.max)issues.push('Would have '+same+' '+p.style+' players (max '+R.style.max+')');
  }
  return issues;
}

/* ---------- actions ---------- */
function toast(m){toastMsg=m;clearTimeout(toastT);toastT=setTimeout(function(){toastMsg='';render()},3500);render()}
function startDraft(){
  if(T()<2||totalPicks()<1)return;
  state.picks=[];state.status='live';state.remaining=null;
  state.clockEnd=Date.now()+state.settings.timerSec*1000;
  modal=null;commit();
}
function pausePick(){
  if(state.status!=='live')return;
  state.remaining=Math.max(0,state.clockEnd-Date.now());state.clockEnd=null;state.status='paused';commit();
}
function resumePick(){
  if(state.status!=='paused')return;
  state.clockEnd=Date.now()+(state.remaining!=null?state.remaining:state.settings.timerSec*1000);state.remaining=null;state.status='live';commit();
}
function resetClock(){
  if(state.status==='live')state.clockEnd=Date.now()+state.settings.timerSec*1000;
  else if(state.status==='paused')state.remaining=state.settings.timerSec*1000;
  commit();
}
function doPick(pid,override){
  if(state.status!=='live')return;
  var ti=currentTeamIdx(),p=P(pid);
  if(!p)return;
  if(availablePlayers().map(function(x){return x.id}).indexOf(pid)<0)return;
  var issues=checkPick(ti,p);
  state.picks.push({pid:pid,team:ti,at:Date.now(),override:issues.length>0});
  if(state.picks.length>=totalPicks()){state.status='done';state.clockEnd=null;state.remaining=null}
  else state.clockEnd=Date.now()+state.settings.timerSec*1000;
  modal=null;commit();
}
function undoPick(){
  if(!state.picks.length)return;
  state.picks.pop();
  if(state.status==='done')state.status='live';
  if(state.status==='live')state.clockEnd=Date.now()+state.settings.timerSec*1000;
  else if(state.status==='paused')state.remaining=state.settings.timerSec*1000;
  commit();
}
function autoPick(){
  if(state.status!=='live')return;
  var ti=currentTeamIdx();
  var list=availablePlayers().sort(function(a,b){return b.dupr-a.dupr});
  for(var i=0;i<list.length;i++){
    if(!checkPick(ti,list[i]).length){doPick(list[i].id,false);return}
  }

function parseLine(line){
  line=line.trim();if(!line)return null;
  var delim=/[\t,]/.test(line);
  var parts=delim?line.split(/[\t,]+/).map(function(s){return s.trim()}).filter(Boolean):line.split(/\s+/);
  var dupr=null,age=null,gender='',style='',name=[];
  parts.forEach(function(t){
    if(dupr===null&&/^[1-8](\.\d{1,3})?$/.test(t))dupr=parseFloat(t);
    else if(age===null&&/^\d{2}$/.test(t)&&+t>=10&&+t<=95)age=parseInt(t,10);
    else if(/^(male|man)$/i.test(t)||(delim&&/^m$/i.test(t)))gender='M';
    else if(/^(female|woman)$/i.test(t)||(delim&&/^f$/i.test(t)))gender='F';
    else if(/^dinker$/i.test(t))style='Dinker';
    else if(/^(aggressive|agg)$/i.test(t))style='Aggressive';
    else if(/^(all-?around|aa)$/i.test(t))style='All-around';
    else name.push(t);
  });
  if(dupr===null||!name.length)return {bad:line};
  return {name:name.join(' '),dupr:dupr,age:age,gender:gender,style:style};
}
function addBulk(text,asSub){
  var added=0,skipped=0,dupes=0;
  text.split(/\n/).forEach(function(l){
    var r=parseLine(l);if(!r)return;
    if(r.bad){skipped++;return}
    var ex=state.players.some(function(p){return p.name.toLowerCase()===r.name.toLowerCase()});
    if(ex){dupes++;return}
    var p=mkPlayer(r.name,r.dupr,asSub);p.age=r.age;p.gender=r.gender;p.style=r.style;
    state.players.push(p);added++;
  });
  commit();
  toast('Added '+added+(dupes?', '+dupes+' already listed':'')+(skipped?', '+skipped+' skipped (no rating found)':''));
}

function toCSV(rows){return rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n')}
function saveFile(name,data){
  var use=window.claude&&window.claude.use;
  if(!use){
    try{
      var blob=new Blob([data],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},1000);toast('Saved '+name);
    }catch(e){toast('Downloads are blocked here. Use Copy instead.')}
    return;
  }
  window.claude.use('downloads').then(function(dl){
    if(!dl){toast('Downloads are not available here. Use Copy instead.');return}
    return dl.save({filename:name,data:data}).then(function(){toast('Saved '+name)},function(e){if(!e||e.code!=='declined')toast('Could not save the file. Use Copy instead.')});
  },function(){toast('Downloads are not available here. Use Copy instead.')});
}
function copyText(t){
  try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Copy was blocked. Select the text and copy it manually.')})}

}

  app.className=screen?'screen':'';
  var body=screen?boardView(false):(mode==='setup'?setupView():mode==='draft'?draftView():picksView());
  app.innerHTML=(screen?'':header())+body+modalHTML()+(screen&&!location.hash?'<button class="btn small exit" data-act="screenOff">Exit big screen</button>':'')+(toastMsg?'<div class="toast" role="status">'+esc(toastMsg)+'</div>':'');
  if(keepQ){var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(ss,ss)}catch(e){}}}
  tick();
}

function tick(){
  var els=document.querySelectorAll('[data-clock]');
  if(!els.length)return;
  var ms=clockMs(),live=state.status==='live';
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(live&&ms<=0){el.textContent='TIME';el.className='time done'}
    else{el.textContent=fmtClock(ms);el.className='time'+(live&&ms<=10000?' low':'')}
  }
}
setInterval(tick,250);

/* ---------- events ---------- */
function setPath(path,val){
  var parts=path.split('.'),o=state;
  for(var i=0;i<parts.length-1;i++)o=o[parts[i]];
  o[parts[parts.length-1]]=val;
}
document.addEventListener('input',function(e){
  if(e.target.id==='q'){search=e.target.value;render()}
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset;
  if(d.act==='eligToggle'){eligibleOnly=t.checked;render();return}
  if(state.status!=='setup'&&!(d.path==='settings.timerSec'))return;
  if(d.path){
    var v=t.type==='checkbox'?t.checked:parseFloat(t.value);
    if(t.type!=='checkbox'&&isNaN(v))return render();
    if(d.path==='settings.rosterSize')v=Math.max(2,Math.round(v));
    setPath(d.path,v);commit();return;
  }
  if(d.pid){
    var p=P(d.pid);if(!p)return;
    var f=d.pf;
    if(f==='dupr'){var n=parseFloat(t.value);if(isNaN(n)||n<1||n>8)return render();p.dupr=n}
    else if(f==='age'){var a=parseInt(t.value,10);p.age=isNaN(a)?null:a}
    else if(f==='sub'){p.sub=t.value==='s'}
    else if(f==='name'){var nm=t.value.trim();if(!nm)return render();p.name=nm}
    else p[f]=t.value;
    commit();return;
  }
  if(d.tid){
    var tm=state.teams.filter(function(x){return x.id===d.tid})[0];if(!tm)return;
    if(d.tf==='captainId'){
      var taken=state.teams.some(function(x){return x!==tm&&x.captainId===t.value});
      if(taken){toast('That player already captains another team');return render()}
      tm.captainId=t.value;
    }else tm.name=t.value.trim()||tm.name;
    commit();
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='veil'){if(e.target===b){modal=null;render()}return}
  switch(a){
    case 'tab':mode=b.dataset.v;render();break;
    case 'screenOn':screen=true;render();break;
    case 'screenOff':screen=false;render();break;
    case 'newWin':
      try{var w=window.open(location.href.split('#')[0]+'#screen','_blank');if(!w)toast('The new window was blocked. Use Big screen instead.')}catch(_){toast('The new window was blocked. Use Big screen instead.')}
      break;
    case 'startAsk':modal={type:'start'};render();break;
    case 'start':startDraft();break;
    case 'pause':pausePick();break;
    case 'resume':resumePick();break;
    case 'resetClock':resetClock();break;
    case 'autopick':autoPick();break;
    case 'undo':undoPick();break;
    case 'endAsk':modal={type:'end'};render();break;
    case 'end':endDraft();break;
    case 'resetAsk':modal={type:'reset'};render();break;
    case 'reset':resetDraft();break;
    case 'pick':modal={type:'pick',pid:id};render();break;
    case 'confirmPick':doPick(id,true);break;
    case 'closeModal':modal=null;render();break;
    case 'up':case 'down':
      var i=state.teams.map(function(t){return t.id}).indexOf(id),j=a==='up'?i-1:i+1;
      if(i>=0&&j>=0&&j<state.teams.length){var tmp=state.teams[i];state.teams[i]=state.teams[j];state.teams[j]=tmp;commit()}
      break;
    case 'shuffle':
      for(var k=state.teams.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var x=state.teams[k];state.teams[k]=state.teams[r];state.teams[r]=x}
      commit();break;
    case 'bulkAdd':
      var txt=document.getElementById('bulk').value,role=document.getElementById('bulkRole').value;
      if(!txt.trim()){toast('Paste at least one player first');break}
      addBulk(txt,role==='s');break;
    case 'rm':
      state.players=state.players.filter(function(p){return p.id!==id});commit();break;
    case 'exportCSV':saveFile('apg-mlp-draft-results.csv',toCSV(resultsRows()));break;
    case 'copyCSV':copyText(toCSV(resultsRows()));break;
    case 'exportJSON':saveFile('apg-mlp-draft-backup.json',JSON.stringify(state,null,1));break;
    case 'copyJSON':copyText(JSON.stringify(state));break;
    case 'restore':
      try{
        var o=JSON.parse(document.getElementById('restore').value);
        if(!o||o.v!==1||!o.players||!o.teams)throw 0;
        state=o;commit();toast('Backup restored');
      }catch(_){toast('That backup could not be read')}
      break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal){modal=null;render()}});
window.addEventListener('storage',function(e){
  if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);render()}catch(_){}}
});
window.addEventListener('hashchange',function(){screen=location.hash==='#screen';render()});

/* ---------- boot ---------- */
state=load()||freshState();
if(location.hash==='#screen')screen=true;
else if(state.status==='live'||state.status==='paused')mode='draft';
render();
})();
</script>
</body>
</html>
